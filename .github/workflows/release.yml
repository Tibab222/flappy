name: Build and Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: flappy-bird-linux
            asset_pkg: flappy-bird-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: flappy-bird-windows
            asset_pkg: flappy-bird-windows.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: flappy-bird-macos
            asset_pkg: flappy-bird-macos.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package assets and binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_pkg
          Copy-Item "target/${{ matrix.target }}/release/*.exe" -Destination release_pkg/
          Copy-Item "assets" -Destination release_pkg/ -Recurse
          Compress-Archive -Path release_pkg/* -DestinationPath ${{ matrix.asset_pkg }}

      - name: Package assets and binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir release_pkg
          cp target/${{ matrix.target }}/release/flappy_bird release_pkg/ 2>/dev/null || cp target/${{ matrix.target }}/release/*.exe release_pkg/ 2>/dev/null || cp target/${{ matrix.target }}/release/* release_pkg/ 2>/dev/null
          # Ajuste le nom ci-dessus si ton binaire s'appelle différemment dans Cargo.toml
          cp -r assets release_pkg/
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czvf ${{ matrix.asset_pkg }} -C release_pkg .
          else
            cd release_pkg && zip -r ../${{ matrix.asset_pkg }} . && cd ..
          fi

      # Publication sur la page GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pkg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}