name: Build Desktop & Web Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_pkg: flappy-bird-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_pkg: flappy-bird-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_pkg: flappy-bird-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package assets and binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_pkg
          Copy-Item "target/${{ matrix.target }}/release/*.exe" -Destination release_pkg/
          Copy-Item "assets" -Destination release_pkg/ -Recurse
          Compress-Archive -Path release_pkg/* -DestinationPath ${{ matrix.asset_pkg }}

      - name: Package assets and binary (Non-Windows)
        if: runner.os != 'Windows'
        run: |
          mkdir release_pkg
          cp target/${{ matrix.target }}/release/flappy_bird release_pkg/ 2>/dev/null || cp target/${{ matrix.target }}/release/* release_pkg/ 2>/dev/null
          cp -r assets release_pkg/
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czvf ${{ matrix.asset_pkg }} -C release_pkg .
          else
            cd release_pkg && zip -r ../${{ matrix.asset_pkg }} . && cd ..
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pkg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy-web:
    name: Build & Deploy WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generate JS Bindings
        run: wasm-bindgen --out-dir ./out --target web target/wasm32-unknown-unknown/release/*.wasm

      - name: Copy Assets and Index
        run: |
          cp -r assets out/
          cp index.html out/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4